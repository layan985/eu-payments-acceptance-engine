function cases(){return `<main class="page"><section class="subhero">${nav()}<div class="subcopy"><span>PUBLIC MERCHANT INVESTIGATIONS</span><h1>Two different payment architectures.</h1><p>Independent public-source analysis — neither merchant is a client.</p>${actions()}</div></section><section class="cases"><a href="/case-files/zalando"><small>CASE FILE 001</small><b>Zalando</b><p>Commerce architecture.</p></a><a href="/case-files/booking"><small>CASE FILE 002</small><b>Booking.com</b><p>Travel-payment architecture.</p></a></section>${foot()}</main>`}
function contact(){return `<main class="page"><section class="subhero">${nav()}<div class="subcopy"><span>PRODUCTION AUDIT INTAKE</span><h1>Request a Checkout Leak Audit.</h1><p>Fixed €1,950 scope. 50% upfront. Start with the perimeter and the decision you need to make — never paste production payment data here.</p></div></section><section class="content"><div class="steps"><div><small>01 / SCOPE</small><b>Bound the question</b><p>Markets, methods, routes, period, decision and data perimeter.</p></div><div><small>02 / FIT</small><b>Confirm minimum fields</b><p>De-identified or aggregate data is enough for many diagnostic surfaces.</p></div><div><small>03 / START</small><b>50% upfront</b><p>Work begins once scope and data-transfer perimeter are agreed.</p></div></div><form class="form" id="intake" action="https://formsubmit.co/layanoraidi@gmail.com" method="POST"><input type="hidden" name="_subject" value="Checkout inquiry"><input type="hidden" name="_template" value="table"><input type="hidden" name="_captcha" value="false"><div class="fields"><label>Name<input name="name" required></label><label>Work email<input name="email" type="email" required></label><label>Company / merchant<input name="company" required></label><label>Inquiry type<select name="inquiry_type"><option>Checkout Leak Audit</option><option>Security / confidentiality</option><option>Research / methodology</option><option>Partnership / other</option></select></label><label>Website<input name="website"></label><label>Markets<input name="markets"></label><label>PSPs / acquirers<input name="psps"></label><label>Payment methods<input name="methods"></label><label>Approx. monthly attempts<input name="volume"></label></div><label>Known symptom<textarea name="symptom" rows="3"></textarea></label><label>Decision you need to make<textarea name="decision" rows="3"></textarea></label><label>Data currently available<textarea name="data_available" rows="3" placeholder="Describe fields only. Do not paste payment data."></textarea></label><label>Additional context<textarea name="notes" rows="4"></textarea></label><div class="submit-row"><button type="submit">SEND AUDIT INQUIRY →</button><span class="fine">Commercial scoping only. No production payment data or files.</span></div></form></section>${foot()}</main>`}
async function page(p){const f=MAP[p];if(!f)return `<main class="page"><section class="subhero">${nav()}<div class="subcopy"><span>404</span><h1>Page not found.</h1><p><a href="/">Return to Checkout →</a></p></div></section>${foot()}</main>`;const s=await get(f),t=TITLES[p]||['CHECKOUT','Payment acceptance intelligence'];return `<main class="page"><section class="subhero">${nav()}<div class="subcopy"><span>${t[0]}</span><h1>${t[1]}</h1>${actions()}</div></section><article class="content">${md(s)}</article>${foot()}</main>`}
function injectHeroMetrics(){const hero=document.querySelector('.hero-copy .metric-grid');const slot=document.querySelector('.hero-metrics');if(hero&&slot){slot.appendChild(hero);}}
function wire(){
  document.querySelectorAll('a[href]').forEach(a=>{
    const raw=a.getAttribute('href')||'';
    if(/^https?:\/\//i.test(raw) && !raw.startsWith(location.origin)){a.target='_blank';a.rel='noopener noreferrer';}
  });
  const current=normalizeRoute(location.pathname);
  document.querySelectorAll('.topbar nav a').forEach(a=>{if(normalizeRoute(new URL(a.href,location.href).pathname)===current)a.classList.add('route-active')});
}
function slugify(v){return String(v||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function polish(){
  document.querySelectorAll('.content h2,.content h3').forEach(h=>{if(!h.id)h.id=slugify(h.textContent.replace(/^\d+\s*[·/.:-]?\s*/,''))});
  document.querySelectorAll('a[href="/reports/checkout-capability-brief.pdf"]').forEach(a=>a.setAttribute('href','/proof-packet'));
  document.querySelectorAll('.content h2').forEach((h,i)=>h.setAttribute('data-section',String(i+1).padStart(2,'0')+' / SECTION'));
  const labels=[['RANDOMIZED SYNTHETIC','randomized'],['PRODUCTION CLIENT DATA','production'],['PROVIDER TEST','provider'],['OFFICIAL SOURCE','official'],['INDEPENDENT PUBLIC-SOURCE ANALYSIS','official'],['SYNTHETIC','synthetic'],['PENDING VALIDATION','pending'],['OBSERVATIONAL','pending'],['INSUFFICIENT ECONOMIC CASE','warning'],['CAUSALITY WARNING','warning']];
  document.querySelectorAll('.content table').forEach((table,i)=>{
    if(table.closest('.table-shell'))return;
    const shell=document.createElement('div'); shell.className='table-shell';
    const bar=document.createElement('div'); bar.className='table-headbar';
    const heading=[...document.querySelectorAll('.content h2')].filter(h=>h.compareDocumentPosition(table)&Node.DOCUMENT_POSITION_FOLLOWING).pop();
    const rows=Math.max(0,table.querySelectorAll('tbody tr').length);
    bar.innerHTML='<span class="label">'+(heading?heading.textContent.replace(/^\d+\s*[·/.:-]?\s*/, '').trim():'Inspectable data')+'</span><span class="rows">'+rows+' row'+(rows===1?'':'s')+' · evidence preserved</span>';
    const scroll=document.createElement('div'); scroll.className='table-scroll';
    table.parentNode.insertBefore(shell,table); shell.appendChild(bar); shell.appendChild(scroll); scroll.appendChild(table);
    table.querySelectorAll('td').forEach(td=>{labels.forEach(([txt,cls])=>{if(td.textContent.trim().toUpperCase()===txt && !td.querySelector('.evidence-pill')) td.innerHTML='<span class="evidence-pill '+cls+'">'+td.textContent.trim()+'</span>';});});
  });
  document.querySelectorAll('.content a').forEach(a=>{if(a.textContent.trim() && !a.closest('table')) a.setAttribute('data-arrow','↗')});
}
const ROUTE_ALIASES={'request-audit.html':'contact','audits.html':'case-files','outcomes.html':'client-outcomes','research.html':'research','intelligence.html':'evidence','methods.html':'methods','evidence.html':'evidence','services.html':'services','firm.html':'about','technology.html':'technology','portfolio.html':'proof-packet','portfolio-live.html':'proof-packet','reports/checkout-capability-brief.pdf':'proof-packet'};
function normalizeRoute(path){let p=String(path||'').split('?')[0].replace(/^\/+|\/+$/g,'');return ROUTE_ALIASES[p]||p}
async function renderRoute(pathname=location.pathname){const raw=String(pathname||'/'); const hash=location.hash; const p=normalizeRoute(raw);app.innerHTML=!p?await home():p==='case-files'?cases():p==='contact'?contact():await page(p);injectHeroMetrics();polish();wire();if(hash){requestAnimationFrame(()=>{const el=document.getElementById(hash.slice(1));if(el)el.scrollIntoView({behavior:'smooth',block:'start'})})}else window.scrollTo({top:0,behavior:'instant'});}
document.addEventListener('click',e=>{const a=e.target.closest('a[href]'); if(!a||e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;const href=a.getAttribute('href'); if(!href||href.startsWith('mailto:')||href.startsWith('tel:')||href.startsWith('javascript:')||a.target==='_blank')return;const u=new URL(href,location.href); if(u.origin!==location.origin)return;const route=normalizeRoute(u.pathname); const recognized=!route||route==='contact'||route==='case-files'||MAP[route]||ROUTE_ALIASES[route];if(!recognized)return;e.preventDefault();history.pushState({},'',u.pathname+u.search+u.hash);renderRoute().catch(showLoadError);});
window.addEventListener('popstate',()=>renderRoute().catch(showLoadError));
function showLoadError(){app.innerHTML=`<main class="page"><section class="subhero">${nav()}<div class="subcopy"><span>LOAD ERROR</span><h1>Content could not load.</h1><p><a href="/">Return to Checkout →</a></p></div></section>${foot()}</main>`;wire()}
renderRoute().catch(showLoadError);
</script></body></html>
