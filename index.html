async function home(){const src=await get('home.md');const d=document.createElement('div');d.innerHTML=renderMD(src);const h1=d.querySelector('h1')?.textContent||'Where is checkout losing money?';const intro=[...d.querySelectorAll('p')][0]?.innerHTML||'';const grids=[...d.querySelectorAll('.metric-grid')];const mhtml=grids[0]?[...grids[0].children].map(x=>x.outerHTML).join(''):'';const phtml=grids[1]?[...grids[1].children].map(x=>`<div class="proof-card">${x.innerHTML}</div>`).join(''):'';const warning=d.querySelector('.callout');const hs=[...d.querySelectorAll('h2')];const links=hs.find(h=>h.textContent.includes('work is inspectable'))?.nextElementSibling;const diagList=hs.find(h=>h.textContent.includes('What gets interrogated'))?.nextElementSibling;const offer=hs.find(h=>h.textContent.includes('Founding production offer'))?.nextElementSibling;const ditems=diagList?[...diagList.querySelectorAll('li')]:[];const litems=links?[...links.querySelectorAll('li a')]:[];return `<main class="shell"><section class="hero">${nav()}<div class="hero-grid"><div class="hero-copy"><div class="kickers"><span>INDEPENDENT PAYMENT ACCEPTANCE INTELLIGENCE</span><span>EVIDENCE BEFORE UPLIFT</span><span>BUYER-INSPECTABLE WORK</span></div><h1>${h1}</h1><div class="hero-lede">${intro}</div>${heroButtons()}</div><div class="hero-cockpit"><div class="cockpit-panel"><div class="cockpit-head"><span>DIAGNOSTIC RECORD / PUBLIC</span><span class="live">● EVIDENCE LIVE</span></div><div class="cockpit-metrics">${mhtml}</div><div class="cockpit-foot"><span><strong>Rule:</strong> decline reasons do not become recovery prescriptions without randomized evidence.</span><span>v1.0</span></div></div><div class="float-card fc1"><strong>3</strong><small>external reviews completed</small></div><div class="float-card fc2"><strong>1</strong><small>measured production case</small></div></div></div></section><section class="cap-strip"><span>Authorization</span><span>3DS / SCA</span><span>Declines</span><span>Retries</span><span>Routing</span><span>Lifecycle</span><span>Reconciliation</span></section><section class="statement"><div class="eyebrow">The operating thesis</div><h2>A decline code describes the failure. <em>The experiment asks what would have changed it.</em></h2></section><section class="proof-board"><div class="section-head"><div class="eyebrow">External + production proof</div><h2>Validation is counted only when something outside the founder exists.</h2></div><div class="proof-grid">${phtml}</div></section><section class="interrogate"><div class="section-head"><div class="eyebrow">What gets interrogated</div><h2>The payment stack is treated as a stateful economic system, not a single authorization KPI.</h2></div><div class="diag-grid">${ditems.map((li,i)=>{const strong=li.querySelector('strong');const title=strong?strong.textContent.replace(/\.$/,''):('Diagnostic '+(i+1));const text=li.textContent.replace(strong?.textContent||'','').trim().replace(/^\.\s*/,'');return `<div class="diag-card"><span class="num">${String(i+1).padStart(2,'0')}</span><h3>${title}</h3><p>${text}</p></div>`}).join('')}</div></section><section class="inspect"><div class="section-head"><div class="eyebrow">Inspectable work</div><h2>Research, public-source investigations and proof objects are open before the sales call.</h2></div><div class="link-grid">${litems.map((a,i)=>`<a class="link-card" href="${a.getAttribute('href')}"><span>${String(i+1).padStart(2,'0')} / OPEN</span><b>${a.textContent}</b></a>`).join('')}</div></section>${warning?`<section class="warning">${warning.innerHTML}</section>`:''}<section class="delivery-showcase"><div class="section-head"><div class="eyebrow">Buyer delivery</div><h2>Compact enough to decide from. Deep enough to interrogate.</h2></div><div class="specimen"><div class="specimen-main"><span class="tag">DAY 5 / DECISION PACK</span><h3>8–15 pages + reproducible analytical outputs.</h3><div class="deliverable-list"><span>Payment Data QA</span><span>Metric dic function subhero(p){const m=META[p]||['CHECKOUT','Payment acceptance intelligence','Evidence-first analysis for multi-market digital payments.'];return `<section class="subhero">${nav()}<div class="subcopy"><div class="eyebrow">${m[0]}</div><h1>${m[1]}</h1><p>${m[2]}</p>${heroButtons()}</div></section>`}function cases(){return `<main class="shell">${subhero('case-files')}<section class="case-index"><a href="/case-files/zalando"><small>CASE FILE 001 / PUBLIC-SOURCE</small><b>Zalando</b><p>Commerce architecture, payment methods, checkout surface and evidence perimeter.</p></a><a href="/case-files/booking"><small>CASE FILE 002 / PUBLIC-SOURCE</small><b>Booking.com</b><p>Travel-payment architecture, merchant/agency states and settlement complexity.</p></a></section>${footer()}</main>`}function contact(){return `<main class="shell"><section class="subhero">${nav()}<div class="subcopy"><div class="eyebrow">PRODUCTION AUDIT INTAKE</div><h1>Request a Checkout Leak Audit.</h1><p>Fixed €1,950 scope. 50% upfront. Start with the decision you need to make and the data perimeter. Do not paste production payment data here.</p></div></section><section class="content"><div class="steps"><div><small>01 / SCOPE</small><b>Bound the decision</b><p>Markets, methods, routes, period, decision and exclusions.</p></div><div><small>02 / FIT</small><b>Confirm minimum fields</b><p>De-identified or aggregate data is enough for many diagnostic surfaces.</p></div><div><small>03 / START</small><b>Lock the perimeter</b><p>50% upfront. Work begins once scope and transfer expectations are agreed.</p></div></div><form class="form" action="https://formsubmit.co/layanoraidi@gmail.com" method="POST"><input type="hidden" name="_subject" value="Checkout inquiry"><input type="hidden" name="_template" value="table"><input type="hidden" name="_captcha" value="false"><div class="fields"><label>Name<input required name="name"></label><label>Work email<input required type="email" name="email"></label><label>Compa function slug(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}function polish(){document.querySelectorAll('.content h2').forEach((h,i)=>{h.dataset.section=String(i+1).padStart(2,'0')+' / SECTION';if(!h.id)h.id=slug(h.textContent)});document.querySelectorAll('.content h3').forEach(h=>{if(!h.id)h.id=slug(h.textContent)});const labels=[['RANDOMIZED SYNTHETIC','randomized'],['PRODUCTION CLIENT DATA','production'],['CLIENT VALIDATION','production'],['COMMERCIAL VALIDATION','production'],['PROVIDER TEST','provider'],['EXTERNAL REVIEW','external'],['INDEPENDENT REPRODUCTION','external'],['REAL PUBLIC DATA','external'],['OFFICIAL SOURCE','external'],['SYNTHETIC','synthetic'],['PENDING','pending'],['OBSERVATIONAL','pending'],['INSUFFICIENT ECONOMIC CASE','warning']];document.querySelectorAll('.content table').forEach(table=>{if(table.closest('.table-shell'))return;const sh=document.createElement('div');sh.className='table-shell';const bar=document.createElement('div');bar.className='table-bar';const rows=table.querySelectorAll('tbody tr').length;bar.innerHTML=`<span>Inspectable evidence table</span><span>${rows} rows · hover to inspect</span>`;const sc=document.createElement('div');sc.className='table-scroll';table.parentNode.insertBefore(sh,table);sh.append(bar,sc);sc.appendChild(table);table.querySelectorAll('td').forEach(td=>labels.forEach(([txt,cl])=>{if(td.textContent.trim().toUpperCase()===txt)td.innerHTML=`<span class="evidence-pill ${cl}">${td.textContent.trim()}</span>`}))});document.querySelectorAll('a[href="/reports/checkout-capability-brief.pdf"]').forEach(a=>a.href='/proof-packet');wire()}function wire(){const cur=route(location.pathname);document.querySelectorAll('.navlinks a').forEach(a=>{if(route(new URL(a.href,location.href).pathname)===cur)a.classList.add('active')});document.querySelectorAll('a[href]').forEach(a=>{const h=a.getAttribute('href')||'';if(/^https?:\/\//i.test(h)&&!h.startsWith(location.origin)){a.target='_blank';a.rel='noopener noreferrer'}})}async function draw(){const p=route(location.pathname);app.innerHTML=!p?await home():p==='case-files'?cases():p==='contact'?contact():await page(p);polish();if(location.hash){requestAnimationFrame(()=>document.getElementById(location.hash.slice(1))?.scrollIntoView({behavior:'smooth'}))}else scrollTo(0,0)}document.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(!a||e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||a.target==='_blank')return;const h=a.getAttribute('href');if(!h||h.startsWith('mailto:')||h.startsWith('tel:'))return;const u=new URL(h,location.href);if(u.origin!==location.origin)return;const p=route(u.pathname);if(!(!p||p==='contact'||p==='case-files'||MAP[p]||ALIASES[p]))return;e.preventDefault();history.pushState({},'',u.pathname+u.search+u.hash);draw().catch(fail)});addEventListener('popstate',()=>draw().catch(fail));function fail(){app.innerHTML=`<main class="shell"><section class="subhero">${nav()}<div class="subcopy"><div class="eyebrow">LOAD ERROR</div><h1>Content could not load.</h1><p><a href="/">Return to Checkout →</a></p></div></section>${footer()}</main>`;wire()}draw().catch(fail);
