*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fff;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}.page{max-width:1510px;margin:0 auto;padding:8px 8px 0}.hero,.subhero{position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(180deg,#0e75b4 0%,#0b9ddd 56%,#18bdf0 100%);color:white}.hero{min-height:650px}.topbar{height:64px;position:relative;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 22px;border-bottom:1px solid rgba(255,255,255,.16)}.brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;letter-spacing:-.02em}.brand-mark{width:18px;height:18px;position:relative}.brand-mark:before,.brand-mark:after{content:"";position:absolute;inset:2px 8px 2px 0;background:#fff;border-radius:2px;transform:skew(-28deg)}.brand-mark:after{inset:2px 0 2px 9px}.brand small{display:block;font-size:8px;font-weight:500;letter-spacing:.06em;opacity:.7}.topbar nav{display:flex;gap:28px;font-size:9px;letter-spacing:.18em;text-transform:uppercase}.topbar nav a{opacity:.8}.topbar nav a:hover{opacity:1}.top-cta{justify-self:end;background:var(--lime);color:#111;border-radius:999px;padding:12px 18px;font:700 9px/1.1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}.hero-copy{position:relative;z-index:5;text-align:center;padding:46px 24px 255px}.hero-copy h1{max-width:760px;margin:0 auto;font-size:clamp(48px,5.6vw,82px);font-weight:530;line-height:.98;letter-spacing:-.055em;text-transform:none}.hero-copy>p{max-width:630px;margin:20px auto 0;font-size:13px;line-height:1.55;color:rgba(255,255,255,.78)}.meta-line{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}.meta-line span{font:700 8px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em;border:1px solid rgba(255,255,255,.26);border-radius:999px;padding uppercase}.content code{background:#eef0ee;border-radius:4px;padding:2px 4px}.content pre{background:#111;color:#f0f3f4;border-radius:14px;padding:18px;overflow:auto}.content .metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.content .metric-grid>div,.delivery-card,.experiment-card,.decision-cards>div,.waterfall-demo>div{border:1px solid var(--line);border-radius:12px;padding:15px;background:#fff}.decision-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.waterfall-demo{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.cases{max-width:1080px;margin:0 auto;padding:58px 22px 90px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.cases>a{border-radius:16px;padding:22px;min-height:260px;background:#f1f2ef}.cases>a:nth-child(2){background:#111;color:white}.cases small{font:700 8px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em}.cases b{display:block;font-size:46px;letter-spacing:-.05em;margin-top:100px}.cases p{font-size:12px;color:#60676b}.cases>a:nth-child(2) p{color:#c2c7c9}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.steps>div{border-radius:14px;background:#f1f2ef;padding:18px;min-height:180px}.steps small{font:700 8px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em}.steps b{display:block;font-size:24px;margin-top:46px;letter-spacing:-.03em}.steps p{font-size:11px;line-height:1.5}.form{border:1px solid var(--line);border-radius:16px;padding:22px;background:#fff}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{display:block;font:700 9px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.07em;text-transform:uppercase;color:#4f565a;margin:12px 0}.form input,.form textarea{display:block;width:100%;margin-top:7px;border:1px solid #d7dbd8;border-radius:10px;padding:12px 13px;background:#fafafa;font:500 14px Arial}.form button{border:0;border-radius:999px;background:#111;color:white;padding:13px 17px;font:700 9px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}.fine{font-size:10px;color:#697074;margin-left:10px}.versions{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 22px}.versions>*{padding:16px 10px;border-right:1px solid var(--line);font:700 8px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}.versions>*:last-child{border-right:0}footer{display:flex;justify-content:space-between;gap:18px;padding:24px 22px 26px;font-size:10px;color:#6b7174}@media(max-width:1080px){.topbar{grid-template-columns:1fr auto}.topbar nav{display:none}.home>.metric-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:720px){.page{padding:6px}.hero,.subhero{border-radius:16px}.topbar{height:56px;padding:0 14px}.brand small{display:none}.top-cta{font-size:8px;padding:10px 12px}.hero{min-height:720px}.hero-copy{padding:52px 12px 330px}.hero-copy h1{font-size:46px}.hero-metrics{bottom:60px;height:250px}.hero-metrics .metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hero-metrics .metric-grid>div{width:auto;min-height:110px;transform:none!important}.proofline{bottom:17px}.logo-strip{justify-content:flex-start;padding:0 14px}.about{padding:58px 12px 24px}.home{padding:24px 10px}.home>.metric-grid,.content .metric-grid{grid-template-columns:1fr 1fr}.home>ul,.feature,.cases,.steps,.fields,.decision-cards{grid-template-columns:1fr}.feature,.cases{padding-left:10px;padding-right:10px}.content{padding:56px 10px 70px}.waterfall-demo{grid-template-columns:1fr 1fr}.versions{margin:0 10px;grid-template-columns:1fr 1fr}.versions>*{border-bottom:1px solid var(--line)}footer{padding:22px 10px;flex-direction:column}.fine{display:block;margin:10px 0}}

</head>
<body><div id="app"></div>
<script>
const RAW='https://raw.githubusercontent.com/layan985/eu-payments-acceptance-engine/main/site_content/';
const REPO='https://github.com/layan985/eu-payments-acceptance-engine';
const MAP={evidence:'evidence.md',research:'research.md','research/checkout-leak-audit':'research-checkout-leak-audit.md','research/authorization-rate':'research-authorization-rate.md','research/payment-state-integrity':'research-payment-state-integrity.md','case-files/zalando':'case-zalando.md','case-files/booking':'case-booking.md','sample-delivery':'sample-delivery.md',services:'services.md',security:'security.md',about:'about.md','proof-packet':'proof-packet.md',standards:'standards.md',faq:'faq.md','client-outcomes':'client-outcomes.md',methods:'methods.md','metric-dictionary':'metric-dictionary.md','technical-notes':'technical-notes.md',technology:'technology.md'};
const TITLES={evidence:['EVIDENCE ROOM','Proof before performance claims'],research:['RESEARCH','Three flagship reports'],'research/checkout-leak-audit':['REPORT 001','Checkout Leak Audit'],'research/authorization-rate':['REPORT 002','The authorization rate is lying to you'],'research/payment-state-integrity':['REPORT 003','Payment State Integrity'],'case-files/zalando':['CASE FILE 001','Zalando'],'case-files/booking':['CASE FILE 002','Booking.com'],'sample-delivery':['SAMPLE DELIVERY','What arrives on Day 5'],services:['FIXED SCOPE','Checkout Leak Audit · €1,950'],security:['DATA PERIMETER','Security before transfer'],about:['ABOUT','Independent payment acceptance intelligence'],'proof-packet':['PROOF PACKET','One URL. The claim boundary.'],standards:['STANDARDS','Claims, corrections + evidence classes'],faq:['FAQ','Commercial + technical questions'],'client-outcomes':['PRODUCTION OUTCOMES','Permission-controlled proof'],methods:['METHODS','How the diagnostic is built'],'metric-dictionary':['METRIC DICTIONARY','Denominators before dashboards'],'technical-notes':['TECHNICAL NOTES','Implementation + reproduction'],technology:['TECHNOLOGY','Provider + payment lifecycle testing']};
const nav=()=>`<header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span>Checkout<small>Independent payment acceptance intelligence</small></span></a><nav><a href="/evidence">Evidence</a><a href="/research">Research</a><a href="/case-files">Cases</a><a href="/sample-delivery">Sample delivery</a><a href="/services">Services</a><a href="/security">Security</a><a href="/about">About</a></nav><a class="top-cta" href="/contact">REQUEST AUDIT · €1,950</a></header>`;
const actions=()=>`<div class="hero-actions"><a class="primary" href="/contact">REQUEST AUDIT</a><a href="/sample-delivery">SAMPLE DELIVERY</a><a href="${REPO}">TECHNICAL RECORD ↗</a></div>`;
const foot=()=>`<section class="versions"><span>LAST UPDATED · 17 AUG 2026</span><span>METHODOLOGY · v1.0</span><a href="/standards">STANDARDS + CORRECTIONS →</a><span>CLAIM LABELS · EVIDENCE-CLASSIFIED</span></section><footer><span>Checkout · evidence-first payment acceptance intelligence</span><span><a href="/faq">FAQ</a> · <a href="/security">Security</a> · <a href="/about">About</a> · <a href="/contact">Request Audit</a></span></footer>`;
async function get(f){const r=await fetch(RAW+f,{cache:'no-store'});if(!r.ok)throw new Error(f);return r.text()}
const md=s=>marked.parse(s,{gfm:true});
async function home(){const s=await get('home.md');const marker='## External + production proof';const [heroPart,rest='']=s.split(marker);return `<main class="page"><section class="hero">${nav()}<div class="clouds"></div><div class="hero-copy">${md(heroPart)}${actions()}</div><div class="hero-metrics"></div><div class="proofline">EVIDENCE-CLASSIFIED PAYMENT INTELLIGENCE · <b>★★★★★</b></div></section><section class="logo-strip"><span>Authorization</span><span>3DS</span><span>Routing</span><span>Retries</span><span>Reconciliation</span><span>Provider tests</span><span>Public evidence</span></section><section class="about"><div class="about-kicker">• ABOUT CHECKOUT</div><h2>A specialist payment intelligence practice built to show <span class="dot blue">↗</span> where checkout loses value, <span class="muted">what the evidence actually supports</span> <span class="dot lime">●</span> and what it does not.</h2></section><section class="home">${md(marker+rest)}</section><section class="feature"><a href="/sample-delivery"><small>BUYER PREVIEW</small><b>See the Day 5 pack</b><p>Executive decision table, failed-value waterfall, authorization matrix, 3DS/retry diagnostic, experiment card, limitations and appendix.</p></a><a href="/security"><small>DATA PERIMETER</small><b>Security before transfer</b><p>Accepted fields, fields never requested, storage, access, transfer, retention, deletion and publication permission.</p></a><a href="/contact"><small>FIXED SCOPE</small><b>Request the €1,950 audit</b><p>Structured scoping. No public upload of production payment data.</p></a></section>${foot()}</main>`}
function cases(){return `<main class="page"><section class="subhero">${nav()}<div class="subcopy"><span>PUBLIC MERCHANT INVESTIGATIONS</span><h1>Two different payment architectures.</h1><p>Independent public-source analysis — neither merchant is a client.</p>${actions()}</div></section><section class="cases"><a href="/case-files/zalando"><small>CASE FILE 001</small><b>Zalando</b><p>Commerce architecture.</p></a><a href="/case-files/booking"><small>CASE FILE 002</small><b>Booking.com</b><p>Travel-payment architecture.</p></a></section>${foot()}</main>`}
function contact(){return `<main class="page"><section class="subhero">${nav()}<div class="subcopy"><span>PRODUCTION AUDIT INTAKE</span><h1>Request a Checkout Leak Audit.</h1><p>Fixed €1,950 scope. 50% upfront. Start with the perimeter and the decision you need to make — never paste production payment data here.</p></div></section><section class="content"><div class="steps"><div><small>01 / SCOPE</small><b>Bound the question</b><p>Markets, methods, routes, period, decision and data perimeter.</p></div><div><small>02 / FIT</small><b>Confirm minimum fields</b><p>De-identified or aggregate data is enough for many diagnostic surfaces.</p></div><div><small>03 / START</small><b>50% upfront</b><p>Work begins once scope and data-transfer perimeter are agreed.</p></div></div><form class="form" id="intake"><div class="fields"><label>Name<input name="name" required></label><label>Work email<input name="email" type="email" required></label><label>Company / merchant<input name="company" required></label><label>Website<input name="website"></label><label>Markets<input name="markets"></label><label>PSPs / acquirers<input name="psps"></label><label>Payment methods<input name="methods"></label><label>Approx. monthly attempts<input name="volume"></label></div><label>Known symptom<textarea name="symptom" rows="3"></textarea></label><label>Decision you need to make<textarea name="decision" rows="3"></textarea></label><label>Data currently available<textarea name="data" rows="3" placeholder="Describe fields only. Do not paste payment data."></textarea></label><label>Additional context<textarea name="notes" rows="4"></textarea></label><button>PREPARE AUDIT INQUIRY →</button><span class="fine">No production data is uploaded through this page.</span></form></section>${foot()}</main>`}
async function page(p){const f=MAP[p];if(!f)return `<main class="page"><section class="subhero">${nav()}<div class="subcopy"><span>404</span><h1>Page not found.</h1><p><a href="/">Return to Checkout →</a></p></div></section>${foot()}</main>`;const s=await get(f),t=TITLES[p]||['CHECKOUT','Payment acceptance intelligence'];return `<main class="page"><section class="subhero">${nav()}<div class="subcopy"><span>${t[0]}</span><h1>${t[1]}</h1>${actions()}</div></section><article class="content">${md(s)}</article>${foot()}</main>`}
function injectHeroMetrics(){const hero=document.querySelector('.hero-copy .metric-grid');const slot=document.querySelector('.hero-metrics');if(hero&&slot){slot.appendChild(hero);}}
function wire(){const f=document.getElementById('intake');if(f)f.onsubmit=e=>{e.preventDefault();const d=new FormData(f);const fields=[['name','Name'],['email','Work email'],['company','Company / merchant'],['website','Website'],['markets','Markets'],['psps','PSPs / acquirers'],['methods','Payment methods'],['volume','Approx. monthly attempts'],['symptom','Known symptom'],['decision','Decision to make'],['data','Data available'],['notes','Additional context']];const body=fields.map(([k,l])=>l+': '+(d.get(k)||'')).join('\n');location.href='mailto:layanoraidi@gmail.com?subject='+encodeURIComponent('Checkout Leak Audit Inquiry')+'&body='+encodeURIComponent(body)}}
(async()=>{const p=location.pathname.replace(/^\/+|\/+$/g,'');app.innerHTML=!p?await home():p==='case-files'?cases():p==='contact'?contact():await page(p);injectHeroMetrics();wire()})().catch(()=>{app.innerHTML=`<main class="page"><section class="subhero">${nav()}<div class="subcopy"><span>LOAD ERROR</span><h1>Content could not load.</h1><p>Please refresh.</p></div></section>${foot()}</main>`})
</script></body></html>
