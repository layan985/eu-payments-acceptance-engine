nt lifecycle testing.']};const ROUTE_ALIASES={'request-audit.html':'contact','audits.html':'case-files','outcomes.html':'client-outcomes','research.html':'research','intelligence.html':'evidence','methods.html':'methods','evidence.html':'evidence','services.html':'services','firm.html':'about','technology.html':'technology','portfolio.html':'proof-packet','portfolio-live.html':'proof-packet','reports/checkout-capability-brief.pdf':'proof-packet'};const normalize=p=>ROUTE_ALIASES[String(p||'').split('?')[0].replace(/^\/+|\/+$/g,'')]||String(p||'').split('?')[0].replace(/^\/+|\/+$/g,'');const nav=()=>`<header class="top"><a class="brand" href="/"><span class="brand-logo"></span><span>Checkout<small>payment acceptance intelligence</small></span></a><nav class="nav"><a href="/evidence">Evidence</a><a href="/research">Research</a><a href="/case-files">Cases</a><a href="/sample-delivery">Delivery</a><a href="/services">Scope</a><a href="/security">Security</a><a href="/proof-packet">Proof packet</a></nav><a class="audit-top" href="/contact">Request audit · €1,950</a></header>`;const actions=()=>`<div class="hero-actions"><a class="primary" href="/contact">Request audit</a><a href="/sample-delivery">Inspect Day 5 delivery</a><a href="/proof-packet">Open proof packet</a></div>`;const foot=()=>`<section class="version"><span>Updated · 17 Aug 2026</span><span>Methodology · v1.0</span><a href="/standards">Standards + corrections →</a><span>Evidence-classified claims</span></section><footer><span>Checkout · independent payment acceptance intelligence</span><span><a href="/faq">FAQ</a> · <a href="/security">Security</a> · <a href="/methods">Methods</a> · <a href="/about">About</a> · <a href="/contact">Request audit</a></span></footer>`;async function get(f){const r=await fetch(RAW+f,{cache:'no-store'});if(!r.ok)throw Error(f);return r.text()}const md=s=>marked.parse(s,{gfm:true});function splitHome(s){const m='## External + production proof';const i=s.indexOf(m);return i<0?[s,'' >Approx. monthly attempts<input name="volume"></label></div><label>Known symptom<textarea name="symptom" rows="3"></textarea></label><label>Decision you need to make<textarea name="decision" rows="3"></textarea></label><label>Data currently available<textarea name="data_available" rows="3" placeholder="Describe fields only. Do not paste payment data."></textarea></label><label>Additional context<textarea name="notes" rows="4"></textarea></label><div class="submit-row"><button type="submit">Send audit inquiry →</button><span class="fine">Commercial scoping only · no production files.</span></div></form></section>${foot()}</main>`}async function page(p){const f=MAP[p];if(!f)return notFound();const s=await get(f),t=TITLES[p]||['CHECKOUT','Payment acceptance intelligence'];return `<main class="shell"><section class="subhero">${nav()}<div class="subcopy"><span>${t[0]}</span><h1>${t[1]}</h1>${actions()}</div></section><article class="content">${md(s)}</article>${foot()}</main>`}const notFound=()=>`<main class="shell"><section class="subhero">${nav()}<div class="subcopy"><span>404</span><h1>This route does not exist.</h1><p><a href="/">Return to Checkout →</a></p></div></section>${foot()}</main>`;function stylize(){const sections=[...document.querySelectorAll('.content h2')];sections.forEach((h,i)=>{if(!h.id)h.id=h.textContent.toLowerCase().replace(/^\d+\s*[·/.:-]?\s*/,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');h.dataset.section=String(i+1).padStart(2,'0')+' / SECTION'});const rail=document.getElementById('articleRail');rail.innerHTML='';sections.forEach(h=>{const a=document.createElement('a');a.href='#'+h.id;a.title=h.textContent;rail.appendChild(a)});document.querySelectorAll('.content table').forEach(table=>{if(table.closest('.table-shell'))return;const shell=document.createElement('div');shell.className='table-shell';const bar=document.createElement('div');bar.className='table-bar';const prev=[...sections].filter(h=>(h.compareDocumentPosition(table)&Node.DOCUM ollIntoView())}else scrollTo(0,0)}document.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(!a||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||a.target==='_blank')return;const href=a.getAttribute('href');if(!href||href.startsWith('mailto:')||href.startsWith('tel:')||href.startsWith('javascript:'))return;const u=new URL(href,location.href);if(u.origin!==location.origin)return;const r=normalize(u.pathname);if(!(r===''||r==='contact'||r==='case-files'||MAP[r]||ROUTE_ALIASES[r]))return;e.preventDefault();history.pushState({},'',u.pathname+u.search+u.hash);render().catch(fail)});addEventListener('popstate',()=>render().catch(fail));function fail(){app.innerHTML=`<main class="shell"><section class="subhero">${nav()}<div class="subcopy"><span>LOAD ERROR</span><h1>The evidence bundle did not load.</h1><p><a href="/">Return to Checkout →</a></p></div></section>${foot()}</main>`;stylize()}render().catch(fail);
