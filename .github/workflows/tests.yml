name: tests

on:
  push:
  pull_request:

jobs:
  reproduce-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reproduce public evidence and run tests
        run: python reproduce.py
